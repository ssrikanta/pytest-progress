[tool.setuptools.packages.find]
where = ["pytest_progress"]

[project.entry-points.pytest11]
progress = "pytest_progress"
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["pytest_progress", "test_progress_report.py"]
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-progress"
version = "1.3.0"
description = "pytest plugin for instant test progress status"
readme = "README.rst"
authors = [
    { name = "Santosh Srikanta", email = "santosh.srikanta@gmail.com" }
]
license = { file = "LICENSE" }
keywords = ["py.test", "pytest", "report"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
    "Programming Language :: Python :: 3.13"
]
dependencies = ["pytest"]

[project.urls]
Homepage = "https://github.com/ssrikanta/pytest-progress"

[tool.setuptools.packages.find]
where = ["pytest_progress"]

[project.entry-points.pytest11]
progress = "pytest_progress"
